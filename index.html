<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ambrozio Car</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Exo+2:ital,wght@1,800;1,900&display=swap" rel="stylesheet">
<style>
/* Layout: barra superior com faixa de velocidade, menu lateral e área principal. Uma ordem de serviço por carro, com 4 etapas em sequência (funilaria, preparação, pintura, polimento). */
:root{
  --bg:#09090b; --surface:#131316; --surface2:#1b1b20; --line:#2a2a30;
  --fg:#eceef1; --muted:#9a9ea8; --red:#e5222b; --red-dim:#2d1013; --silver:#cfd2d8;
  --fun:#5aa2ff; --prep:#ff7ab6; --pin:#b48cff; --mont:#d7e35a; --pol:#2ed3c6;
  --amber:#f5a524; --pause:#ff8a4c; --green:#4ade80;
  --display:'Exo 2','Arial Black',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* marca */
.wm{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:.9}
.wm-a{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;letter-spacing:.02em;
  background:linear-gradient(180deg,#fff 20%,#aeb1b8);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm-b{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.08em;color:var(--silver)}
.wm.big .wm-a{font-size:clamp(40px,8vw,64px)}.wm.big .wm-b{font-size:clamp(22px,4vw,32px)}
.speed{display:flex;gap:8px;align-items:center;height:6px}
.speed i{display:block;height:4px;width:46%;background:var(--red);transform:skewX(-35deg)}
.speed b{display:block;flex:1;height:4px;background:repeating-linear-gradient(90deg,var(--silver) 0 2px,transparent 2px 6px);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}

/* topo */
.top{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.top .date{color:var(--muted);font-size:13px;margin-right:auto;text-transform:capitalize}
.who{display:flex;align-items:center;gap:10px}
.who small{display:block;color:var(--muted);font-size:12px;line-height:1.1}
.who strong{display:block;line-height:1.2}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:8px 14px;font-weight:600;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--silver)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:#f03a42;border-color:#f03a42}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;
  background:var(--surface2);border:2px solid var(--c,var(--silver));flex:none}
.bell{position:relative;padding:6px 10px}
.bell svg{width:20px;height:20px;display:block}
.badge{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}

/* app */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding-block:20px 48px;align-items:start}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-left:3px solid transparent;
  padding:10px 12px;border-radius:0 6px 6px 0;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface);color:var(--fg)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--fg);border-left-color:var(--red)}
.nav svg{width:18px;height:18px;flex:none}
main{min-width:0}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pagehead h1{font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;letter-spacing:.01em}
.pagehead p{margin:2px 0 0;color:var(--muted)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.stat strong{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;line-height:1.15}
.stat small{color:var(--muted)}
.stat.alert{border-color:#5b1b20;background:var(--red-dim)}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar .grow{flex:1}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--fg);color:#0a0a0b;border-color:var(--fg)}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-fazer,.p-aguardando{color:var(--muted)}
.s-andamento,.p-servico{color:var(--amber)}
.s-pausada{color:var(--pause)}
.s-feita,.p-pronto,.ok{color:var(--green)}
.p-entregue{color:var(--silver)}
.warn{color:var(--amber)}.crit{color:#ff5b62}

/* cartões da agenda */
.sechead{display:flex;align-items:center;gap:8px;font-family:var(--display);font-style:italic;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:14px;margin:22px 0 10px}
.sechead::before{content:"";width:22px;height:4px;background:var(--c);transform:skewX(-35deg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.empcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.empcard header{display:flex;align-items:center;gap:10px}
.empcard header small{display:block;color:var(--muted);font-size:12px}
.item{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;width:100%;min-width:0}
.item:hover{border-color:var(--silver)}
.item.dim{opacity:.65}
.l1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.l2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px}
.l3{color:var(--muted);font-size:12px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:14px;color:var(--muted)}

/* minha agenda */
.mylist{display:flex;flex-direction:column;gap:10px}
.myjob{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px 14px}
.myjob .l1 b{font-size:17px}
.myjob ul{margin:4px 0 0;padding-left:18px;color:var(--silver);font-size:14px}
.myjob .hint{color:var(--muted);font-size:12px;margin-top:4px}
h2.sec{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;margin:22px 0 10px;display:flex;gap:10px;align-items:center}
h2.sec small{font-family:var(--body);font-style:normal;font-weight:500;color:var(--muted);font-size:13px}

/* lista de OS */
.oslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.oscard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px;width:100%;min-width:0}
.oscard:hover{border-color:var(--silver)}
.oscard .sub{color:var(--muted);font-size:13px}
.stepper{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.step{border-top:4px solid var(--line);padding-top:6px;min-width:0}
.step span{display:block;font-weight:700;font-size:13px}
.step small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.step.t-feita{border-top-color:var(--green)}.step.t-andamento{border-top-color:var(--amber)}.step.t-pausada{border-top-color:var(--pause)}

/* detalhe da OS */
.oshead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.oshead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.subh{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:4px 0 0}
.stagebox{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.stagebox.mine{box-shadow:0 0 0 1px var(--c)}
.stagebox header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stagebox header h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:17px}
.stagebox .resp{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stagebox .resp select{width:auto;padding:5px 8px}
.tasks{display:flex;flex-direction:column;gap:6px}
label.task{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:15px;font-weight:500}
.task input{width:20px;height:20px;accent-color:var(--red);flex:none;padding:0}
.task.done span{color:var(--muted);text-decoration:line-through}
.task.miss span{color:#ff8a8f}
.log{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.log b{color:var(--silver);font-weight:600}
.worked{font-size:13px;color:var(--silver)}
.addtask{display:flex;gap:8px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface2)}
.banner.crit{border-color:#5b1b20;background:var(--red-dim)}
.actionbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--red);border-radius:10px;padding:12px;background:var(--red-dim)}
.actionbar small{display:block;color:var(--muted)}
.actionbar .act{display:flex;gap:10px;flex-wrap:wrap}

/* fotos */
.thumbs{display:flex;flex-wrap:wrap;gap:8px}
.thumb{position:relative;width:96px;height:72px;border-radius:6px;overflow:hidden;border:1px solid var(--line);padding:0;background:var(--bg);display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.78);color:#fff;line-height:1;padding:0}
figure.fig{margin:0;width:116px}
.fig .thumb{width:116px;height:86px}
figcaption{font-size:12px;color:var(--muted);margin-top:3px}
.photos{display:flex;flex-direction:column;gap:8px}
.addphoto{flex-direction:row;position:relative;gap:8px;align-items:center}
.addphoto input{position:absolute;opacity:0;width:1px;height:1px;padding:0}
.addphoto:focus-within .btn{outline:2px solid var(--silver);outline-offset:2px}
.lb{margin:0;max-width:min(900px,100%);display:flex;flex-direction:column;gap:8px;align-items:center}
.lb img{max-width:100%;max-height:78vh;border-radius:8px;background:var(--surface)}
.lb figcaption{color:var(--silver);font-size:14px}

/* notificações */
.notifs{display:flex;flex-direction:column;gap:6px}
.notif{text-align:left;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.notif.new{border-color:var(--red)}
.notif i{width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--muted)}
.notif .k-open{background:var(--amber)}.notif .k-pause{background:var(--pause)}.notif .k-done{background:var(--green)}.notif .k-problem{background:#ff5b62}
.notif small{color:var(--muted);white-space:nowrap}

/* tabelas */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface2);font-weight:600}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td small{display:block;color:var(--muted)}
td .btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.plate{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;background:#fff;color:#111;border-radius:4px;padding:1px 7px;font-weight:700;font-size:13px;border-bottom:3px solid #1f4fb5;white-space:nowrap}

/* estoque */
.qty{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);line-height:1;font-weight:700}
.qty button:hover{border-color:var(--silver)}
.qty strong{min-width:46px;text-align:center}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--green)}
.meter.warn i{background:var(--amber)}.meter.crit i{background:#ff5b62}

/* financeiro */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h3{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:12px;font-weight:600}
.hbar{display:grid;grid-template-columns:90px minmax(0,1fr) 96px;gap:10px;align-items:center;margin-bottom:12px}
.hbar .track{height:18px;background:var(--surface2);border-radius:4px;display:flex;overflow:hidden}
.hbar .paid{background:var(--c)}
.hbar .pend{background:repeating-linear-gradient(135deg,var(--c) 0 3px,transparent 3px 7px);opacity:.55}
.hbar strong{text-align:right}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.key i{display:inline-block;width:12px;height:10px;margin-right:5px;background:var(--silver)}
.key i.h{background:repeating-linear-gradient(135deg,var(--silver) 0 2px,transparent 2px 5px)}
.in{color:var(--green)}.out{color:#ff8a8f}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:32px}
.hero{display:flex;flex-direction:column;gap:24px}
.hero p{color:var(--muted);max-width:42ch;font-size:17px;margin:0}
.hero .speed{max-width:420px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:var(--fg);width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--silver);outline:none}
.err{color:#ff8a8f;font-size:14px;min-height:20px;margin:0}
.demo{display:flex;flex-wrap:wrap;gap:8px}
.demo button{background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.demo button:hover{border-color:var(--silver)}
.demo i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--red));display:inline-block}
.note{color:var(--muted);font-size:13px;margin:0}

/* avisos do dono, equipe, acessos de teste */
.avisos{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.avisos header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.avisos h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.uname{font-family:ui-monospace,'SFMono-Regular',Menlo,monospace;color:var(--silver)}
details.testes{border-top:1px solid var(--line);padding-top:12px}
details.testes summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600}
details.testes .demo{margin-top:10px}
.tabs-gap{margin-left:auto}

/* modais */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ov2{z-index:70}
.modal{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:12px;width:min(520px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(840px,100%)}
.modal h2{font-family:var(--display);font-style:italic;font-weight:800;font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.secblock{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.secblock h3{font-family:var(--display);font-style:italic;font-weight:800;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:#0a0a0b;
  padding:10px 16px;border-radius:8px;font-weight:600;z-index:80;max-width:calc(100% - 32px)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:12px}
  .nav{flex-direction:row;overflow-x:auto;gap:6px}
  .nav button{border-left:0;border-bottom:3px solid transparent;border-radius:6px 6px 0 0;white-space:nowrap}
  .nav button[aria-current="page"]{border-bottom-color:var(--red)}
  .login{grid-template-columns:minmax(0,1fr);gap:24px;min-height:0}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .myjob{grid-template-columns:minmax(0,1fr)}
  .two{grid-template-columns:minmax(0,1fr)}
  .hbar{grid-template-columns:70px minmax(0,1fr) 84px}
  .oslist{grid-template-columns:minmax(0,1fr)}
  .modal{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* busca por placa */
.top .date{margin-right:0}
.search{position:relative;flex:1 1 240px;max-width:380px;margin-right:auto}
.search input{padding-left:34px;background:var(--surface)}
.search>svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.qres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:40;max-height:65vh;overflow:auto;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
.qr{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;width:100%}
.qr:hover,.qr:focus-visible{border-color:var(--silver)}
.qres .note{padding:6px 8px}
.plate.none{background:transparent;color:var(--muted);border:1px dashed #4a4a52;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em}

/* meta do dia */

function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('ambrozio-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);setTimeout(()=>res(null),2500)}catch(e){res(null)}})}
function idbPut(id,src){if(!idb)return;try{idb.transaction('f','readwrite').objectStore('f').put(src,id)}catch(e){}}
function idbAll(){return new Promise(res=>{if(!idb)return res({});try{const out={};const rq=idb.transaction('f').objectStore('f').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>res(out)}catch(e){res({})}})}
const NOPHOTO='data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="#1b1b20"/><text x="200" y="135" font-family="Arial" font-size="16" fill="#9a9ea8" text-anchor="middle">foto não encontrada neste aparelho</text></svg>');
function addPhoto(os,stage,leg,src,by,ts){const ph={id:nPh++,stage,leg,src,ts:ts||now(),by};os.photos.push(ph);idbPut(ph.id,src);return ph}
const rep=(k,v)=>idb&&k==='src'&&typeof v==='string'&&v.startsWith('data:image/jpeg')?'@':v;
function save(){try{localStorage.setItem(SKEY,JSON.stringify({v:2,CARS,OSL,NOTIFS,ESTOQUE,FIN,TODO,POSTS,IDEIAS,SENHAS,c:{nextCar,nTask,nOS,nProb,nPh,nNot,nItem,nTodo,nPost,nIdeia}},rep))}catch(e){if(!saveWarned){saveWarned=true;setTimeout(()=>toast('Não deu para salvar neste aparelho (memória cheia ou bloqueada).'),50)}}}
function load(){try{const r=localStorage.getItem(SKEY);if(!r)return false;const d=JSON.parse(r);if(!d||d.v!==2)return false;
  CARS=d.CARS;OSL=d.OSL;NOTIFS=d.NOTIFS||[];ESTOQUE=d.ESTOQUE||ESTOQUE;FIN=d.FIN||FIN;TODO=d.TODO||[];POSTS=d.POSTS||[];IDEIAS=d.IDEIAS||[];SENHAS=d.SENHAS||{};({nextCar,nTask,nOS,nProb,nPh,nNot,nItem,nTodo}=d.c);nPost=d.c.nPost||1;nIdeia=d.c.nIdeia||1;return true}catch(e){return false}}

const state={user:null,view:'agenda',filtro:'todos',osFiltro:'abertas',finFiltro:'todos',estFiltro:'todos',todoDay:null,mktWeek:null};

let ASG=null;

/* ---------- regras da OS: a OS acompanha o carro de setor em setor ---------- */
const applicable=os=>STAGES.filter(k=>os.stages[k].on);
const isDone=os=>applicable(os).length>0&&applicable(os).every(k=>os.stages[k].st==='feita');
const curStage=os=>applicable(os).find(k=>os.stages[k].st!=='feita')||null;
const nextAfter=(os,k)=>{const a=applicable(os);return a.slice(a.indexOf(k)+1).find(x=>os.stages[x].st!=='feita')||null};
const prevPending=(os,k)=>{const a=applicable(os);return a.slice(0,a.indexOf(k)).find(p=>os.stages[p].st!=='feita')};
const myStages=(os,u)=>u.faz.filter(k=>os.stages[k].on&&(os.stages[k].emp===null||os.stages[k].emp===u.id));
const osOf=carId=>{const l=OSL.filter(o=>o.car===+carId).sort((a,b)=>b.id-a.id);return l.find(o=>!isDone(o))||l[0]};
function worked(s){let t=0,start=null;for(const e of s.log){if(e.k==='aberta'||e.k==='retomada')start=e.ts;else if((e.k==='pausada'||e.k==='finalizada')&&start!==null){t+=e.ts-start;start=null}}if(start!==null)t+=now()-start;return t}
function stInfo(os,k){const s=os.stages[k];const pend=prevPending(os,k);let key=s.st;if(key==='fila'&&pend)key='bloq';
  const label={fila:'No setor · pode começar',bloq:'Ainda em '+(pend?SETORES[pend].nome:''),andamento:'Em andamento',pausada:'Pausada',feita:'Finalizada'}[key];
  return {key,label,cls:key==='bloq'||key==='fila'?'fazer':key}}
function stLine(os,k){const s=os.stages[k],i=stInfo(os,k);
  if(i.key==='andamento'){const a=s.log.filter(e=>e.k==='aberta').pop();return `Aberta às ${hm(a?a.ts:now())} · ${dur(worked(s))} trabalhados`}
  if(i.key==='pausada'){const p=[...s.log].reverse().find(e=>e.k==='pausada');return `Pausada às ${hm(p.ts)}${p.why?' · '+p.why:''}`}
  if(i.key==='feita')return `Finalizada ${dthm(finTs(s))}${worked(s)?' · '+dur(worked(s)):''}`;
  return '';}
const finTs=s=>{const f=[...s.log].reverse().find(e=>e.k==='finalizada');return f?f.ts:0};

/* fila de cada setor, na ordem que o Alex escolher */
const inBoard=(os,k)=>{const s=os.stages[k];return s.on&&s.st!=='feita'&&(curStage(os)===k||s.meta===TK())};
const boardPending=k=>OSL.filter(os=>inBoard(os,k)).sort((a,b)=>a.stages[k].ord-b.stages[k].ord);
const boardDone=k=>OSL.filter(os=>{const s=os.stages[k];return s.on&&s.st==='feita'&&isToday(finTs(s))}).sort((a,b)=>finTs(a.stages[k])-finTs(b.stages[k]));
const group=(k,empId)=>boardPending(k).filter(os=>os.stages[k].emp===empId);
function renumber(k){OSL.filter(os=>os.stages[k].on&&os.stages[k].st!=='feita').sort((a,b)=>a.stages[k].ord-b.stages[k].ord).forEach((os,i)=>os.stages[k].ord=i+1)}
function toEnd(os,k){const s=os.stages[k];const mx=Math.max(0,...OSL.filter(o=>o!==os&&inBoard(o,k)).map(o=>o.stages[k].ord));s.ord=mx+0.5;renumber(k)}
function posOf(os,k){const g=group(k,os.stages[k].emp);const i=g.indexOf(os);return i<0?0:i+1}
function arrive(os,k){if(os.stages[k].meta!==TK())toEnd(os,k)}
function syncCar(os){const c=car(os.car);if(!c||c.st==='entregue')return;c.st=isDone(os)?'pronto':'servico'}

/* meta do dia: serviços colocados na agenda de hoje */
function metaList(f){const r=[];OSL.forEach(os=>STAGES.forEach(k=>{const s=os.stages[k];if(s.on&&s.meta===TK()&&(!f||f(os,k,s)))r.push({os,k,s})}));return r}
const metaCount=f=>{const l=metaList(f);return {t:l.length,d:l.filter(x=>x.s.st==='feita').length}};
const entregasHoje=()=>CARS.filter(c=>c.entrega===TK()).sort((a,b)=>(a.hora||'99')<(b.hora||'99')?-1:(a.hora||'99')>(b.hora||'99')?1:a.entOrd-b.entOrd);

/* notificações: vão para quem está em NOTIF_PARA (hoje, o Alex) */
const notify=(kind,txt,os)=>NOTIFS.push({id:nNot++,ts:now(),kind,txt,os,lida:false});

/* ações da OS (cada uma avisa o Alex) */
function startStage(os,k,u){const s=os.stages[k],t=now();s.st='andamento';s.meta=TK();s.log.push(L('aberta',t));
  notify('open',`${fn(u.id)} abriu a OS do ${cn(car(os.car))} (${SETORES[k].nome}) às ${hm(t)}.`,os.id);return t}
function pauseStage(os,k,u,why){const s=os.stages[k],t=now();s.st='pausada';s.log.push(L('pausada',t,why));
  notify('pause',`${fn(u.id)} pausou a ${SETORES[k].nome} do ${cn(car(os.car))} às ${hm(t)}. Motivo: ${why}.`,os.id)}
function resumeStage(os,k,u){const s=os.stages[k],t=now();s.st='andamento';s.log.push(L('retomada',t));
  notify('open',`${fn(u.id)} retomou a ${SETORES[k].nome} do ${cn(car(os.car))} às ${hm(t)}.`,os.id)}
function finishStage(os,k,u,nota,fotos){const s=os.stages[k],t=now();
  if(s.st==='fila')s.log.push(L('aberta',t));
  s.st='feita';s.nota=nota||s.nota;s.meta=s.meta||TK();s.log.push(L('finalizada',t));
  (fotos||[]).forEach(src=>addPhoto(os,k,SETORES[k].nome+' concluída',src,u.id,t));
  const c=car(os.car),nx=curStage(os);
  if(nx)arrive(os,nx);
  notify('done',`${fn(u.id)} finalizou a ${SETORES[k].nome} do ${cn(c)} em ${dthm(t)}.${nx?' A OS foi junto para a '+SETORES[nx].nome+(os.stages[nx].emp?' ('+fn(os.stages[nx].emp)+')':'')+'.':''}`,os.id);
  syncCar(os);if(isDone(os))notify('done',`${cn(c)} está pronto para retirada.`,os.id);
  renumber(k);}
function moveTo(os,target,u){const t=now(),ti=STAGES.indexOf(target),cur=curStage(os);
  if(cur===target)return;
  os.stages[target].on=true;
  STAGES.forEach((k,i)=>{const s=os.stages[k];if(!s.on)return;
    if(i<ti&&s.st!=='feita'){s.on=false;s.meta=null;}
    if(i===ti&&s.st==='feita'){s.st='fila';s.log.push(L('reaberta',t));}});
  if(os.stages[target].emp===null&&DEF_EMP[target]&&!os.stages[target].log.length)os.stages[target].emp=DEF_EMP[target];
  arrive(os,target);STAGES.forEach(renumber);syncCar(os);
  notify('open',`${fn(u.id)} passou o ${cn(car(os.car))} para a ${SETORES[target].nome}. A OS foi junto.`,os.id);}

/* ---------- busca por placa ---------- */
function findCars(q){const n=norm(q),p=plateN(q);if(!n)return[];
  return CARS.filter(c=>(p.length>=2&&plateN(c.placa).includes(p))||norm(cn(c)+' '+c.cliente).includes(n))
    .sort((a,b)=>(a.st==='entregue')-(b.st==='entregue')).slice(0,8)}
function carSummary(c){const os=osOf(c.id);if(!os)return 'Sem ordem de serviço';const cur=curStage(os);
  if(!cur)return `${os.num} · ${c.st==='entregue'?'Entregue':'Pronto para retirada'}`;
  const s=os.stages[cur],p=posOf(os,cur);
  return `${os.num} · Em ${SETORES[cur].nome}${s.emp?' com '+fn(s.emp):''}${p?' · '+p+'º na fila':''}`}
function qresHtml(q){const l=findCars(q);
  if(!l.length)return `<p class="note">Nenhum carro com “${esc(q)}”. <button class="btn sm" data-act="newos" data-placa="${esc(q)}" style="margin-left:6px">Registrar entrada</button></p>`;
  return l.map(c=>{const os=osOf(c.id);return `<button class="qr" ${os?`data-act="os" data-os="${os.id}"`:`data-act="newos" data-car="${c.id}"`}><div class="l1"><b>${esc(cn(c))}</b>${plateH(c)}${c.cliente?`<span class="note">${esc(c.cliente)}</span>`:''}</div><div class="l2">${esc(carSummary(c))}</div></button>`}).join('')}

/* ---------- agenda da oficina (Alex e diretor de operações) ---------- */
function qItem(os,k,pos,opt){
  const c=car(os.car),s=os.stages[k],i=stInfo(os,k),done=s.st==='feita',mt=s.meta===TK();
  return `<div class="qi ${done?'dim':''} ${opt.next?'next':''}" style="--c:${SETORES[k].cor}">
    <span class="pos num" aria-label="${done?'Feito':pos+'º na fila'}">${done?'✓':pos+'º'}</span>
    <button class="qbody" data-act="os" data-os="${os.id}"><div class="l1"><b>${esc(cn(c))}</b>${plateH(c)}</div>
      <div class="l2"><span class="pill s-${i.cls}">${i.label}</span>${c.cliente?`<span>${esc(c.cliente)}</span>`:''}</div>
      ${!done&&stLine(os,k)?`<div class="l3">${esc(stLine(os,k))}</div>`:''}</button>
    ${opt.move&&!done?`<div class="arrows"><button data-act="up" data-os="${os.id}" data-stage="${k}" ${opt.first?'disabled':''} aria-label="Subir ${esc(cn(c))} na fila">▲</button><button data-act="down" data-os="${os.id}" data-stage="${k}" ${opt.last?'disabled':''} aria-label="Descer ${esc(cn(c))} na fila">▼</button></div>`:'<span></span>'}
    ${opt.move&&!done?`<div class="qfoot"><button class="chip" data-act="meta" data-os="${os.id}" data-stage="${k}" aria-pressed="${mt}">${mt?'✓ Na meta de hoje':'+ Colocar na meta de hoje'}</button></div>`:''}
  </div>`;}

function empCard(k,u,list,done){
  const id=u?u.id:null;
  const m=metaCount((os,kk,s)=>kk===k&&s.emp===id);
  const act=list.length;
  const items=list.map((os,i)=>qItem(os,k,i+1,{move:true,first:i===0,last:i===list.length-1})).join('')+done.map(os=>qItem(os,k,0,{})).join('');
  return `<div class="empcard" style="--c:${SETORES[k].cor}"><header>${u?`<span class="avatar" style="--c:${u.cor}">${initials(u.nome)}</span>`:'<span class="avatar" style="--c:var(--muted)">?</span>'}
    <div style="flex:1;min-width:0"><strong>${u?esc(u.curto):'Qualquer do setor'}</strong><small>${act} ${act===1?'carro na fila':'carros na fila'}${u?'':' · sem responsável'}</small>
    ${m.t?`<div class="empmeta"><span class="num">${m.d}/${m.t}</span>${prog(pct(m.d,m.t))}<span class="num">${pct(m.d,m.t)}%</span></div>`:''}</div></header>
    ${items||'<div class="empty">Sem carros no momento.</div>'}
    <button class="addcar" data-act="assign" data-stage="${k}" data-emp="${id||''}">+ Colocar carro${u?' para '+esc(u.curto):''}</button></div>`;}

function metaBox(){
  const all=metaCount(),p=pct(all.d,all.t),ent=entregasHoje(),entD=ent.filter(c=>c.st==='entregue').length;
  const rows=STAGES.map(k=>{const m=metaCount((os,kk)=>kk===k);return `<div class="mrow" style="--c:${SETORES[k].cor}"><span>${SETORES[k].nome}</span>${prog(pct(m.d,m.t))}<b class="num">${m.d}/${m.t}</b></div>`}).join('');
  return `<section class="metabox" aria-label="Meta do dia"><div class="metabig"><span>Meta do dia · serviços</span><strong class="num">${p}%</strong><small class="num">${all.d} de ${all.t} serviços da agenda de hoje finalizados</small>${prog(p,'big')}</div>
    <div class="metarows">${rows}<div class="mrow ent" style="--c:var(--silver)"><span>Entregas</span>${prog(pct(entD,ent.length))}<b class="num">${entD}/${ent.length}</b></div></div></section>`;}

    ${adm?'<div style="margin-top:8px"><button class="btn sm" data-act="entrega">+ Marcar entrega para hoje</button></div>':''}`;}

function viewAgenda(){
  const sino=NOTIF_PARA.includes(state.user.id);
  const novos=sino?NOTIFS.filter(n=>!n.lida).sort((a,b)=>b.ts-a.ts).slice(0,3):[];
  const total=NOTIFS.filter(n=>!n.lida).length;
  const fora=OSL.filter(os=>{const k=curStage(os);return k&&os.stages[k].meta!==TK()}).length;
  const myTodo=state.user.id==='alex'?TODO.filter(t=>t.dia<=TK()&&!t.done).length:0;
  let h=`<div class="pagehead"><div><h1>Agenda da oficina</h1><p>Use ▲▼ para escolher a ordem de cada fila. A OS vai junto quando o carro muda de setor.</p></div><button class="btn red" data-act="newos">+ Registrar entrada</button></div>
    ${novos.length?`<section class="avisos" aria-label="Avisos novos"><header><h2>Avisos novos${total>novos.length?' ('+total+')':''}</h2><button class="btn sm ghost" data-act="notifs">Ver todos</button></header>
      ${novos.map(n=>`<button class="notif new" data-act="os" data-os="${n.os}" data-n="${n.id}"><i class="k-${n.kind}"></i><span>${esc(n.txt)}</span><small>${dthm(n.ts)}</small></button>`).join('')}</section>`:''}
    ${metaBox()}
    ${fora||myTodo?`<div class="bar">${fora?`<div class="banner grow"><span>${fora} ${fora===1?'carro está':'carros estão'} no setor mas fora da meta de hoje.</span><button class="btn sm" data-act="montarmeta">Colocar todos na meta de hoje</button></div>`:''}
      ${myTodo?`<button class="btn" data-act="nav" data-v="alex">Minha agenda: ${myTodo} ${myTodo===1?'pendente':'pendentes'}</button>`:''}</div>`:''}
    <div class="bar">${[['todos','Todos'],...STAGES.map(k=>[k,SETORES[k].nome]),['ent','Entregas']].map(([k,l])=>`<button class="tab" data-act="filtro" data-f="${k}" aria-pressed="${state.filtro===k}">${l}</button>`).join('')}</div>`;
  STAGES.filter(k=>state.filtro==='todos'||state.filtro===k).forEach(k=>{
    const m=metaCount((os,kk)=>kk===k);
    h+=`<div class="sechead" style="--c:${SETORES[k].cor}">${tit(k)}<span class="note num" style="font-family:var(--body);font-style:normal;letter-spacing:0;text-transform:none;font-weight:500">· meta ${m.d}/${m.t} (${pct(m.d,m.t)}%)</span></div><div class="cards">`;
    const dn=boardDone(k);
    USERS.filter(u=>u.faz.includes(k)).forEach(u=>{
      const list=group(k,u.id),done=dn.filter(os=>os.stages[k].emp===u.id);
      if(!showIn(u,k)&&!list.length&&!done.length)return;
      h+=empCard(k,u,list,done);
    });
    const free=group(k,null),fdone=dn.filter(os=>os.stages[k].emp===null);
    if(free.length||fdone.length)h+=empCard(k,null,free,fdone);
    h+='</div>';
  });
  if(state.filtro==='todos'||state.filtro==='ent')h+=entregasHtml(true);
  return h;
}

/* ---------- agenda do funcionário ---------- */
function viewMine(){
  const u=state.user,items=[];
  OSL.forEach(os=>STAGES.forEach(k=>{const s=os.stages[k];if(s.on&&u.faz.includes(k)&&(s.emp===u.id||s.emp===null))items.push({os,k,s})}));
  const pend=items.filter(x=>x.s.st!=='feita'&&inBoard(x.os,x.k)).sort((a,b)=>STAGES.indexOf(a.k)-STAGES.indexOf(b.k)||(a.s.emp===null)-(b.s.emp===null)||a.s.ord-b.s.ord);
  const feitas=items.filter(x=>x.s.st==='feita'&&isToday(finTs(x.s)));
  const meta=items.filter(x=>x.s.meta===TK()),md=meta.filter(x=>x.s.st==='feita').length,p=pct(md,meta.length);
  const multi=u.faz.length>1;
  const nextIdx=pend.findIndex(x=>x.s.st==='andamento'||x.s.st==='pausada')>=0?-1:pend.findIndex(x=>stInfo(x.os,x.k).key==='fila');
  const card=(x,n)=>{const os=x.os,k=x.k,s=os.stages[k],c=car(os.car),i=stInfo(os,k);
    const btn=i.key==='fila'?'Abrir OS':i.key==='andamento'||i.key==='pausada'?'Continuar':'Ver OS';
    const isNext=n===nextIdx;
    return `<div class="myjob" style="--c:${SETORES[k].cor}"><div><div class="l1">${s.st!=='feita'?`<span class="posbig num">${n+1}º</span>`:''}<b>${esc(cn(c))}</b>${plateH(c)}${isNext?'<span class="tag">Próximo</span>':''}${multi?`<span class="pill" style="color:${SETORES[k].cor}">${SETORES[k].nome}</span>`:''}<span class="pill s-${i.cls}">${i.label}</span></div>
      ${stLine(os,k)?`<div class="l2" style="margin-top:4px">${esc(stLine(os,k))}</div>`:''}
      ${s.tasks.length?`<ul>${s.tasks.map(t=>`<li>${esc(t.txt)}${t.done?' (feito)':''}</li>`).join('')}</ul>`:''}
      ${c.cliente?`<div class="hint">${esc(c.cliente)} · ${os.num}</div>`:`<div class="hint">${os.num}</div>`}
      ${isNext?'<div class="hint">Ao abrir, o Alex é avisado e o serviço começa a contar.</div>':''}</div>
      <button class="btn ${isNext||i.key==='andamento'||i.key==='pausada'?'red':''}" data-act="os" data-os="${os.id}" data-stage="${k}">${btn}</button></div>`};
  const hoje=new Date(now()).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  return `<div class="pagehead"><div><h1>Minha agenda</h1><p>${esc(u.rotulo)} · ${hoje}</p></div></div>
    <section class="metabox" style="grid-template-columns:minmax(0,1fr)"><div class="metabig"><span>Sua meta de hoje</span><strong class="num">${p}%</strong><small class="num">${md} de ${meta.length} serviços finalizados</small>${prog(p,'big')}</div></section>
    ${u.mkt?(()=>{const hj=POSTS.filter(p=>p.dia===TK());return `<div class="banner" style="margin-bottom:6px"><span>Marketing hoje: ${hj.length?hj.length+' '+(hj.length===1?'conteúdo':'conteúdos')+' · '+hj.filter(p=>p.status==='postado').length+' postado(s)':'nada agendado'}</span><button class="btn sm" data-act="nav" data-v="mkt">Abrir marketing</button></div>`})():''}
    <h2 class="sec">Sua fila <small>na ordem definida pelo Alex</small></h2>
    <div class="mylist">${pend.length?pend.map(card).join(''):'<div class="empty">Nenhum carro na sua fila agora.</div>'}</div>
    ${feitas.length?`<h2 class="sec">Finalizadas hoje</h2><div class="mylist">${feitas.map(x=>card(x,-2)).join('')}</div>`:''}`;
}

/* ---------- agenda pessoal do Alex ---------- */
function viewAlex(){
  const day=state.todoDay||TK(),isT=day===TK();
  const list=TODO.filter(t=>t.dia===day).sort((a,b)=>(a.done-b.done)||((a.hora||'99')<(b.hora||'99')?-1:(a.hora||'99')>(b.hora||'99')?1:a.id-b.id));
  const late=isT?TODO.filter(t=>!t.done&&t.dia<day).sort((a,b)=>a.dia<b.dia?-1:1):[];
  const d=list.filter(t=>t.done).length,p=pct(d,list.length);
  const lbl=cap(dkDate(day).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'}));
  const row=(t,isLate)=>`<div class="todo ${t.done?'done':''} ${isLate?'late':''}"><input type="checkbox" data-todo="${t.id}" ${t.done?'checked':''} aria-label="Concluir: ${esc(t.txt)}"><span class="h num">${isLate?dm(dkDate(t.dia).getTime()):esc(t.hora||'—')}</span><span class="t">${esc(t.txt)}</span>
    <span>${isLate?`<button class="btn sm" data-act="todohoje" data-id="${t.id}">Passar p/ hoje</button>`:''}<button class="x" data-act="tododel" data-id="${t.id}" aria-label="Apagar: ${esc(t.txt)}">×</button></span></div>`;
  return `<div class="pagehead"><div><h1>Minha agenda</h1><p>O que o Alex precisa fazer no dia a dia</p></div></div>
    <div class="dayhead"><button class="btn sm" data-act="day" data-d="-1" aria-label="Dia anterior">‹</button><strong>${isT?'Hoje · ':''}${lbl}</strong><button class="btn sm" data-act="day" data-d="1" aria-label="Próximo dia">›</button>${isT?'':'<button class="btn sm ghost" data-act="day" data-d="0">Voltar para hoje</button>'}</div>
    ${list.length?`<section class="metabox" style="grid-template-columns:minmax(0,1fr)"><div class="metabig"><span>Concluído no dia</span><strong class="num">${p}%</strong><small class="num">${d} de ${list.length} tarefas</small>${prog(p,'big')}</div></section>`:''}
    <form id="f-todo" class="todoform"><input id="t-txt" required placeholder="O que precisa fazer? Ex.: ligar para a seguradora sobre o Creta" aria-label="Nova tarefa"><input id="t-hora" type="time" aria-label="Horário (opcional)"><button class="btn red" type="submit">Adicionar</button></form>
    ${late.length?`<h2 class="sec">Ficaram de dias anteriores <small>${late.length}</small></h2><div class="todos">${late.map(t=>row(t,true)).join('')}</div>`:''}
    <h2 class="sec">${isT?'Hoje':'Neste dia'}</h2><div class="todos">${list.length?list.map(t=>row(t)).join(''):'<div class="empty">Nada anotado para este dia.</div>'}</div>`;
}

const monday=s=>{const d=dkDate(s),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return dk(d.getTime())};

  const ws=state.mktWeek||monday(TK()),days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i));

    return `<div class="wday ${d===TK()?'today':''}"><header><span>${dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span><b class="num">${dt.getDate()}</b></header>

    <span style="display:flex;gap:4px;align-items:center"><button class="btn sm" data-act="newpost" data-ideia="${i.id}">Agendar</button><button class="x" data-act="delideia" data-id="${i.id}" aria-label="Apagar ideia: ${esc(i.txt)}">×</button></span></div>`).join('');

    <div class="week">${cols}</div>
    <h2 class="sec">Ideias de conteúdo <small>anote e depois agende</small></h2>
    <form id="f-ideia" class="ideaform"><input id="i-txt" required placeholder="Ex.: antes e depois da funilaria do Fusca" aria-label="Nova ideia"><select id="i-fmt" aria-label="Formato">${Object.entries(FORMATOS).map(([k,v])=>`<option value="${k}">${v.nome}</option>`).join('')}</select><button class="btn red" type="submit">Guardar ideia</button></form>
    <div class="todos">${ideias||'<div class="empty">Nenhuma ideia guardada ainda.</div>'}</div>`;

/* ---------- detalhe da OS ---------- */
const figs=(os,list)=>list.length?`<div class="thumbs">${list.map(p=>`<figure class="fig"><button class="thumb" data-act="photo" data-os="${os.id}" data-ph="${p.id}" aria-label="Ampliar foto: ${esc(p.leg)}"><img src="${p.src}" alt="${esc(p.leg)}"></button><figcaption>${esc(p.leg)}<br>${esc(fn(p.by))} · ${dthm(p.ts)}</figcaption></figure>`).join('')}</div>`:'<span class="note">Nenhuma foto.</span>';

function stageBox(os,k,u,adm,mine){
  const s=os.stages[k],i=stInfo(os,k),isMine=mine.includes(k),canTick=(isMine&&s.st==='andamento')||(adm&&s.st!=='feita');
  const later=!adm&&s.st==='feita'&&u.faz.some(x=>STAGES.indexOf(x)>STAGES.indexOf(k)&&os.stages[x].on);
  const resp=adm&&s.st!=='feita'?`<span class="resp">Responsável <select data-assign="${os.id}" data-stage="${k}" aria-label="Responsável pela ${SETORES[k].nome}"><option value="">Qualquer do setor</option>${USERS.filter(x=>x.faz.includes(k)).map(x=>`<option value="${x.id}" ${s.emp===x.id?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></span>`
    :`<span class="resp">${s.emp?esc(emp(s.emp).nome):'Qualquer do setor'}</span>`;
  const p=s.st!=='feita'&&inBoard(os,k)?posOf(os,k):0;
  return `<section class="stagebox ${isMine?'mine':''}" style="--c:${SETORES[k].cor}"><header><h3>${tit(k)}</h3><span class="pill s-${i.cls}">${i.label}</span>${p?`<span class="pill" style="color:var(--silver)">${p}º na fila</span>`:''}${isMine?'<span class="pill" style="color:var(--silver)">Sua etapa</span>':''}${resp}</header>
    ${s.tasks.length?`<div class="tasks">${s.tasks.map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-task="${t.id}" data-os="${os.id}" data-stage="${k}" ${t.done?'checked':''} ${canTick?'':'disabled'}><span>${esc(t.txt)}</span></label>`).join('')}</div>`:'<span class="note">Sem itens detalhados para este setor.</span>'}
    ${adm&&s.st!=='feita'?`<div class="addtask"><input id="nt-${os.id}-${k}" placeholder="Novo item para a ${SETORES[k].nome}" aria-label="Novo item para a ${SETORES[k].nome}"><button class="btn sm" data-act="addtask" data-os="${os.id}" data-stage="${k}">Adicionar</button></div>
      <div class="qfoot" style="grid-column:auto"><button class="chip" data-act="meta" data-os="${os.id}" data-stage="${k}" aria-pressed="${s.meta===TK()}">${s.meta===TK()?'✓ Na meta de hoje':'+ Colocar na meta de hoje'}</button>${s.st==='fila'&&!s.log.length&&applicable(os).length>1?`<button class="chip" data-act="rmstage" data-os="${os.id}" data-stage="${k}">Este carro não passa por aqui</button>`:''}</div>`:''}
    ${s.log.length?`<ol class="log">${s.log.map(e=>`<li><b>${LOGL[e.k]||e.k}</b> ${dthm(e.ts)}${e.why?' · '+esc(e.why):''}</li>`).join('')}</ol>${worked(s)?`<div class="worked">Tempo trabalhado: <strong class="num">${dur(worked(s))}</strong></div>`:''}`:''}
    ${s.nota?`<div class="note">Observação ao finalizar: ${esc(s.nota)}</div>`:''}
    ${os.photos.some(p=>p.stage===k)?`<div class="subh">Fotos da ${SETORES[k].nome} (${os.photos.filter(p=>p.stage===k).length})</div>${figs(os,os.photos.filter(p=>p.stage===k))}`:''}
    ${adm||(isMine&&i.key!=='bloq')?`<div><label class="addphoto"><input type="file" accept="image/*" multiple data-stagephoto="${os.id}" data-stage="${k}"><span class="btn sm">+ Adicionar fotos da ${SETORES[k].nome}</span></label></div>`:''}
    ${later?`<div><button class="btn sm" data-act="flag" data-os="${os.id}" data-stage="${k}">Sinalizar problema nesta etapa</button></div>`:''}</section>`;
}

function osDetail(id,keep){
  const os=OSL.find(x=>x.id===+id);if(!os){toast('OS não encontrada');return;}
  const c=car(os.car),u=state.user,adm=isAdmin(u),ap=applicable(os);
  const mine=adm?[]:myStages(os,u);
  const probs=os.problemas.filter(p=>p.aberto).map(p=>`<div class="banner crit"><div><strong>Problema sinalizado por ${esc(fn(p.by))} (${esc(emp(p.by).rotulo)}) na etapa de ${SETORES[p.stage].nome} · ${dthm(p.ts)}</strong><br>${esc(p.txt)}</div>${adm?`<button class="btn sm" data-act="resolve" data-os="${os.id}" data-p="${p.id}">Marcar resolvido</button>`:''}</div>`).join('');
  const bars=mine.map(k=>{const s=os.stages[k],pend=prevPending(os,k);
    if(s.st==='feita')return '';
    if(pend)return `<div class="banner">O carro ainda está na ${SETORES[pend].nome}. A sua etapa (${SETORES[k].nome}) libera quando ele chegar no seu setor.</div>`;
    if(s.st==='andamento')return `<div class="actionbar"><div><strong>Sua etapa: ${SETORES[k].nome}</strong><small>${esc(stLine(os,k))}</small></div><div class="act"><button class="btn" data-act="pause" data-os="${os.id}" data-stage="${k}">Pausar serviço</button><button class="btn red" data-act="finish" data-os="${os.id}" data-stage="${k}">Finalizar serviço</button></div></div>`;
    if(s.st==='pausada')return `<div class="actionbar"><div><strong>Sua etapa: ${SETORES[k].nome}</strong><small>${esc(stLine(os,k))}</small></div><div class="act"><button class="btn red" data-act="resume" data-os="${os.id}" data-stage="${k}">Retomar serviço</button></div></div>`;
    return `<div class="actionbar"><div><strong>Sua etapa: ${SETORES[k].nome}</strong><small>O carro está no seu setor</small></div><div class="act"><button class="btn red" data-act="start" data-os="${os.id}" data-stage="${k}">Abrir etapa</button></div></div>`;
  }).join('');
  const cur=curStage(os),nx=cur&&nextAfter(os,cur);
  const carbar=adm?`<div class="carbar" style="--c:${cur?SETORES[cur].cor:'var(--green)'}"><div><small>O carro (e esta OS) está em</small><strong>${cur?tit(cur):c.st==='entregue'?'Entregue':'Pronto para retirada'}</strong>${cur?`<small>${os.stages[cur].emp?esc(emp(os.stages[cur].emp).nome):'Qualquer do setor'}${inBoard(os,cur)&&posOf(os,cur)?' · '+posOf(os,cur)+'º na fila':''}</small>`:''}</div>
    <div class="act">${cur?`<button class="btn red" data-act="nextsector" data-os="${os.id}">${nx?'Enviar para '+SETORES[nx].nome+' →':'Finalizar '+SETORES[cur].nome}</button>`:''}
    <select data-movesector="${os.id}" aria-label="Passar o carro para outro setor"><option value="">Passar para outro setor…</option>${STAGES.filter(k=>k!==cur).map(k=>`<option value="${k}">${SETORES[k].nome}</option>`).join('')}</select></div></div>`:'';
  const entTxt=c.entrega===TK()?`Entregar hoje${c.hora?' às '+c.hora:''}`:'';
  openModal(`<div class="oshead"><div><h2>${esc(cn(c))} ${plateH(c)}</h2><p>${os.num}${c.cliente?' · '+esc(c.cliente):''}${c.ent?' · entrada '+c.ent:''}${entTxt?' · <strong class="warn">'+entTxt+'</strong>':''}</p>
      ${adm?`<div class="headbtns"><button class="btn sm" data-act="editcar" data-car="${c.id}" data-os="${os.id}">${c.placa?'Editar dados do carro':'Cadastrar placa'}</button>${c.st!=='entregue'?`<button class="btn sm" data-act="entrega" data-car="${c.id}" data-os="${os.id}">${entTxt?'Alterar entrega':'Marcar entrega para hoje'}</button>`:''}${c.st==='pronto'?`<button class="btn sm red" data-act="carout" data-car="${c.id}" data-os="${os.id}">Registrar entrega</button>`:''}</div>`:''}</div>
      <button class="btn sm ghost" data-act="close">Fechar</button></div>
    ${probs}${carbar}${bars}
    <div class="subh">Fotos do recebimento (${os.photos.filter(p=>p.stage==='in').length})</div>${figs(os,os.photos.filter(p=>p.stage==='in'))}
    ${adm?`<div><label class="addphoto"><input type="file" accept="image/*" multiple data-stagephoto="${os.id}" data-stage="in"><span class="btn sm">+ Adicionar fotos do recebimento</span></label></div>`:''}
    ${ap.map(k=>stageBox(os,k,u,adm,mine)).join('')}`,true,keep);

/* ---------- pátio ---------- */

      ${stat('Entregas hoje',entregasHoje().filter(c=>c.st==='entregue').length+' / '+entregasHoje().length,'')}${stat('Sem placa',semPlaca,semPlaca?'cadastre pela OS':'tudo cadastrado',semPlaca?'alert':'')}</div>

/* ---------- estoque e EPI ---------- */
const nivel=i=>i.qtd<=i.min*0.5?'crit':i.qtd<i.min?'warn':'ok';
function viewEstoque(){
  const baixos=ESTOQUE.filter(i=>nivel(i)!=='ok'),ord={crit:0,warn:1,ok:2};
  const lista=ESTOQUE.filter(i=>state.estFiltro==='todos'||i.cat===state.estFiltro);
  const rows=[...lista].sort((a,b)=>ord[nivel(a)]-ord[nivel(b)]||a.nome.localeCompare(b.nome)).map(i=>{const n=nivel(i),pc=Math.min(100,Math.round(i.qtd/(i.min*2||1)*100));
    return `<tr><td><strong>${esc(i.nome)}</strong></td><td>${i.cat}</td><td class="num">${i.min} ${esc(i.un)}</td>
      <td><div class="meter ${n}" role="img" aria-label="${pc}% do nível ideal"><i style="width:${pc}%"></i></div></td>
      <td><span class="pill ${n==='ok'?'ok':n}">${n==='ok'?'Normal':n==='warn'?'Baixo':'Crítico'}</span></td>
      <td><div class="qty"><button data-act="est" data-id="${i.id}" data-d="-1" aria-label="Retirar 1 de ${esc(i.nome)}">−</button><strong class="num">${i.qtd}</strong><button data-act="est" data-id="${i.id}" data-d="1" aria-label="Adicionar 1 de ${esc(i.nome)}">+</button><small>${esc(i.un)}</small></div></td></tr>`}).join('');
  return `<div class="pagehead"><div><h1>Estoque e EPI</h1><p>Materiais da oficina e equipamentos de proteção</p></div><button class="btn red" data-act="newitem">+ Novo item</button></div>
    <div class="stats">${stat('Itens cadastrados',ESTOQUE.length,'')}${stat('Abaixo do mínimo',baixos.length,baixos.length?'repor em breve':'tudo em dia',baixos.length?'alert':'')}${stat('EPI abaixo do mínimo',baixos.filter(i=>i.cat==='EPI').length,'')}</div>
    <div class="bar">${[['todos','Tudo'],['Material','Materiais'],['EPI','EPI']].map(([k,l])=>`<button class="tab" data-act="estf" data-f="${k}" aria-pressed="${state.estFiltro===k}">${l}</button>`).join('')}</div>
    <div class="tablewrap"><table><thead><tr><th>Item</th><th>Tipo</th><th>Mínimo</th><th>Nível</th><th>Situação</th><th class="r">Em estoque</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---------- financeiro ---------- */
function viewFin(){
  const ent=FIN.filter(f=>f.tipo==='in'),sai=FIN.filter(f=>f.tipo==='out');
  const rec=ent.filter(f=>f.pago).reduce((a,f)=>a+f.valor,0),apr=ent.filter(f=>!f.pago).reduce((a,f)=>a+f.valor,0),des=sai.reduce((a,f)=>a+f.valor,0);
  const porSetor=STAGES.map(s=>({s,pago:ent.filter(f=>f.setor===s&&f.pago).reduce((a,f)=>a+f.valor,0),pend:ent.filter(f=>f.setor===s&&!f.pago).reduce((a,f)=>a+f.valor,0)})).filter(x=>x.pago+x.pend>0);
  const max=Math.max(1,...porSetor.map(x=>x.pago+x.pend));
  const bars=porSetor.map(x=>`<div class="hbar" style="--c:${SETORES[x.s].cor}"><span>${SETORES[x.s].nome}</span>
    <div class="track" role="img" aria-label="${SETORES[x.s].nome}: ${brl(x.pago)} recebido, ${brl(x.pend)} a receber"><div class="paid" style="width:${x.pago/max*100}%"></div><div class="pend" style="width:${x.pend/max*100}%"></div></div><strong class="num">${brl(x.pago+x.pend)}</strong></div>`).join('');
  const lista=FIN.filter(f=>state.finFiltro==='todos'||(state.finFiltro==='pend'?(f.tipo==='in'&&!f.pago):f.pago)).sort((a,b)=>b.data.split('/').reverse().join('').localeCompare(a.data.split('/').reverse().join('')));
  const rows=lista.map(f=>`<tr><td class="num">${f.data}</td><td>${esc(f.desc)}</td><td>${SETORES[f.setor]?SETORES[f.setor].nome:esc(f.setor)}</td>
    <td class="r num ${f.tipo==='in'?'in':'out'}">${f.tipo==='in'?'+':'−'} ${brl(f.valor)}</td><td>${f.pago?`<span class="pill ok">${f.tipo==='in'?'Recebido':'Pago'}</span>`:'<span class="pill warn">A receber</span>'}</td>
    <td class="r">${!f.pago?`<button class="btn sm" data-act="receber" data-id="${f.id}">Marcar recebido</button>`:''}</td></tr>`).join('');
  const mes=cap(new Date(now()).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  return `<div class="pagehead"><div><h1>Financeiro</h1><p>${mes} · valores de exemplo</p></div></div>
    <div class="stats">${stat('Recebido',brl(rec),'')}${stat('A receber',brl(apr),'')}${stat('Despesas',brl(des),'')}${stat('Saldo do mês',brl(rec-des),rec-des>=0?'positivo':'negativo')}</div>
    <div class="cols"><section class="panel"><h3>Faturamento por setor</h3>${bars}<div class="key"><span><i></i>Recebido</span><span><i class="h"></i>A receber</span></div></section>
      <section class="panel"><h3>Resumo</h3><dl class="kv"><dt>Faturado</dt><dd class="num">${brl(rec+apr)}</dd><dt>Recebido</dt><dd class="num in">${brl(rec)}</dd><dt>A receber</dt><dd class="num warn">${brl(apr)}</dd><dt>Despesas</dt><dd class="num out">${brl(des)}</dd><dt>Saldo atual</dt><dd class="num"><strong>${brl(rec-des)}</strong></dd></dl></section></div>
    <div class="bar">${[['todos','Tudo'],['pend','A receber'],['pago','Pagos']].map(([k,l])=>`<button class="tab" data-act="finf" data-f="${k}" aria-pressed="${state.finFiltro===k}">${l}</button>`).join('')}</div>
    <div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Setor / tipo</th><th class="r">Valor</th><th>Situação</th><th class="r"></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function openModal(h,wide,keep){const md=$('#md'),ov=$('#ov'),sc=md.scrollTop,was=!ov.hidden;
  md.className='modal'+(wide?' wide':'');md.innerHTML=h;ov.hidden=false;md.scrollTop=(keep&&was)?sc:0;if(!was)md.focus({preventScroll:true});}

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3400);}
const picker=()=>`<div class="photos"><label class="addphoto"><input type="file" accept="image/*" multiple data-draft="1"><span class="btn sm">+ Adicionar fotos</span></label><div id="thumbs" class="thumbs"></div></div>`;
function thumbsDraft(){const el=$('#thumbs');if(el)el.innerHTML=DRAFT.photos.map((s,i)=>`<div class="thumb"><img src="${s}" alt="Foto ${i+1}"><button type="button" class="rm" data-act="rmdraft" data-i="${i}" aria-label="Remover foto ${i+1}">×</button></div>`).join('');}
function readImg(file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',0.72))};im.onerror=()=>res(null);im.src=fr.result};fr.onerror=()=>res(null);fr.readAsDataURL(file)})}

function asList(q){const l=q?findCars(q):CARS.filter(c=>c.st!=='entregue');
  return l.length?l.map(c=>`<button class="qr" data-act="aspick" data-car="${c.id}"><div class="l1"><b>${esc(cn(c))}</b>${plateH(c)}${c.cliente?`<span class="note">${esc(c.cliente)}</span>`:''}</div><div class="l2">${esc(carSummary(c))}</div></button>`).join(''):'<p class="note">Nenhum carro encontrado. Use “Registrar entrada” para cadastrar.</p>'}

function pwdForm(){openModal(`<h2>Trocar senha</h2><form id="f-pwd" style="display:flex;flex-direction:column;gap:12px">
    <label>Senha atual<input id="w-old" type="password" required autocomplete="current-password"></label>
    <label>Nova senha<input id="w-new" type="password" required minlength="4" autocomplete="new-password"></label>
    <label>Repita a nova senha<input id="w-rep" type="password" required autocomplete="new-password"></label>
    <p class="err" id="w-err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn red" type="submit">Salvar nova senha</button></div></form>`);}
function pwdResetForm(id){const u=emp(id);openModal(`<h2>Redefinir senha</h2><form id="f-pwdr" data-u="${u.id}" style="display:flex;flex-direction:column;gap:12px">
    <p class="note">${esc(u.nome)} · usuário <span class="uname">${esc(u.usuario)}</span>. Passe a senha nova para a pessoa; ela pode trocar depois em “Trocar senha”.</p>
    <label>Nova senha<input id="r-new" required minlength="4" autocomplete="off"></label>
    <p class="err" id="r-err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn red" type="submit">Redefinir</button></div></form>`);}
function itemForm(){
  openModal(`<h2>Novo item</h2><form id="f-item" style="display:flex;flex-direction:column;gap:12px">
    <label>Nome<input id="i-nome" required placeholder="ex.: Luvas nitrílicas"></label>
    <div class="two"><label>Tipo<select id="i-cat"><option>Material</option><option>EPI</option></select></label><label>Unidade<input id="i-un" required placeholder="un, L, kg, pares"></label></div>
    <div class="two"><label>Quantidade agora<input id="i-qtd" type="number" min="0" step="1" required value="0"></label><label>Mínimo desejado<input id="i-min" type="number" min="0" step="1" required value="1"></label></div>
    <div class="actions"><button type="button" class="btn" data-act="close">Cancelar</button><button class="btn red" type="submit">Adicionar</button></div></form>`);
}
function pauseForm(osId,k){
  openModal(`<h2>Pausar serviço</h2><form id="f-pause" data-os="${osId}" data-stage="${k}" style="display:flex;flex-direction:column;gap:12px"><label>Motivo da pausa<select id="p-why">${MOTIVOS.map(m=>`<option>${m}</option>`).join('')}</select></label>
    <p class="note">O Alex é avisado com o horário e o motivo.</p><div class="actions"><button type="button" class="btn" data-act="backos" data-os="${osId}">Voltar</button><button class="btn red" type="submit">Pausar</button></div></form>`);
}
function finishForm(osId,k,goto){
  DRAFT.photos=[];const os=OSL.find(x=>x.id===+osId),s=os.stages[k],falta=s.tasks.filter(t=>!t.done),nx=nextAfter(os,k);
  openModal(`<h2>Finalizar ${SETORES[k].nome}</h2><form id="f-finish" data-os="${osId}" data-stage="${k}" data-goto="${goto||''}" style="display:flex;flex-direction:column;gap:12px">
    ${falta.length?`<div class="banner crit"><div><strong>Ainda falta marcar:</strong><br>${falta.map(t=>esc(t.txt)).join('<br>')}</div></div>`:s.tasks.length?'<div class="banner"><span class="ok">Todos os itens estão marcados como feitos.</span></div>':''}
    ${nx?`<p class="note">Ao finalizar, o carro e a OS vão para a ${SETORES[nx].nome}${os.stages[nx].emp?' ('+esc(fn(os.stages[nx].emp))+')':''}.</p>`:'<p class="note">Esta é a última etapa: o carro fica pronto para retirada.</p>'}
    <div><div class="subh" style="margin-bottom:6px">Fotos da finalização · obrigatório pelo menos 1</div><p class="note" style="margin:0 0 6px">Pode colocar quantas fotos precisar.</p>${picker()}</div>
    <label>Observação (opcional)<textarea id="f-nota" rows="2" placeholder="Algo que a próxima etapa precisa saber"></textarea></label>
    <p class="err" id="f-err" role="alert"></p>
    <div class="actions"><button type="button" class="btn" data-act="backos" data-os="${osId}">Voltar</button><button class="btn red" type="submit">Finalizar serviço</button></div></form>`);
}
function flagForm(osId,k){
  openModal(`<h2>Sinalizar problema</h2><form id="f-flag" data-os="${osId}" data-stage="${k}" style="display:flex;flex-direction:column;gap:12px">
    <p class="note">Etapa: ${SETORES[k].nome}. O Alex é avisado.</p>
    <label>O que está errado ou faltando?<textarea id="g-txt" rows="3" required placeholder="ex.: a porta não foi pintada"></textarea></label>
    <div class="actions"><button type="button" class="btn" data-act="backos" data-os="${osId}">Voltar</button><button class="btn red" type="submit">Enviar aviso</button></div></form>`);
}
function notifsModal(){
  const l=[...NOTIFS].sort((a,b)=>b.ts-a.ts);
  openModal(`<h2>Notificações</h2><div class="notifs">${l.length?l.map(n=>`<button class="notif ${n.lida?'':'new'}" data-act="os" data-os="${n.os}" data-n="${n.id}"><i class="k-${n.kind}"></i><span>${esc(n.txt)}</span><small>${dthm(n.ts)}</small></button>`).join(''):'<div class="empty">Nenhuma notificação ainda.</div>'}</div>
    <div class="actions"><button class="btn" data-act="readall">Marcar todas como lidas</button><button class="btn red" data-act="close">Fechar</button></div>`);
}

function openOS(id){const os=OSL.find(x=>x.id===+id),u=state.user;if(!os)return;
  if(!isAdmin(u)){const k=myStages(os,u).find(x=>os.stages[x].st==='fila'&&!prevPending(os,x));
    if(k){const t=startStage(os,k,u);toast(`OS aberta às ${hm(t)}. O Alex foi avisado.`);render();}}
  osDetail(id);}
function refreshOS(id){render();osDetail(id,true);}
function render(){save();$('#root').innerHTML=state.user?appHtml():loginHtml();}
const getOS=id=>OSL.find(x=>x.id===+id);
function swap(os,k,dir){const s=os.stages[k],g=group(k,s.emp),i=g.indexOf(os),j=i+dir;if(i<0||j<0||j>=g.length)return;
  const o=g[j].stages[k],t=o.ord;o.ord=s.ord;s.ord=t;renumber(k);}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){closeModal();return;}
  const qr=$('#qres');if(qr&&!e.target.closest('.search'))qr.hidden=true;
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,d=t.dataset;
  if(a==='close2'){$('#ov2').hidden=true;return;}
  if(a==='demo'){const u=emp(d.u);$('#l-user').value=u.usuario;$('#l-pass').value=u.senha;$('#l-err').textContent='';}
  else if(a==='logout'){state.user=null;state.filtro='todos';closeModal();render();}
  else if(a==='nav'){state.view=d.v;closeModal();render();}
  else if(a==='filtro'){state.filtro=d.f;render();}
  else if(a==='osf'){state.osFiltro=d.f;render();}
  else if(a==='finf'){state.finFiltro=d.f;render();}
  else if(a==='estf'){state.estFiltro=d.f;render();}
  else if(a==='newos'){if(qr)qr.hidden=true;osForm(d.car,d.placa);}
  else if(a==='newitem'){itemForm();}
  else if(a==='pwd'){pwdForm();}
  else if(a==='pwdreset'){pwdResetForm(d.u);}
  else if(a==='os'){if(qr)qr.hidden=true;if(d.n){const n=NOTIFS.find(x=>x.id===+d.n);if(n){n.lida=true;render();}}openOS(d.os);}
  else if(a==='close'){closeModal();}
  else if(a==='backos'){if(d.os)osDetail(d.os);else closeModal();}
  else if(a==='pause'){pauseForm(d.os,d.stage);}
  else if(a==='finish'){finishForm(d.os,d.stage);}
  else if(a==='flag'){flagForm(d.os,d.stage);}
  else if(a==='start'){const os=getOS(d.os);const tt2=startStage(os,d.stage,state.user);toast(`Etapa aberta às ${hm(tt2)}. O Alex foi avisado.`);refreshOS(os.id);}
  else if(a==='resume'){const os=getOS(d.os);resumeStage(os,d.stage,state.user);toast('Serviço retomado. O Alex foi avisado.');refreshOS(os.id);}
  else if(a==='resolve'){const os=getOS(d.os);os.problemas.find(p=>p.id===+d.p).aberto=false;refreshOS(os.id);toast('Problema marcado como resolvido');}
  else if(a==='addtask'){const os=getOS(d.os),inp=$('#nt-'+d.os+'-'+d.stage),v=inp.value.trim();if(!v){inp.focus();return;}
    os.stages[d.stage].tasks.push({id:nTask++,txt:v,done:false});refreshOS(os.id);}
  else if(a==='photo'){const os=getOS(d.os),p=os.photos.find(x=>x.id===+d.ph);$('#lbimg').src=p.src;$('#lbimg').alt=p.leg;$('#lbcap').textContent=p.leg+' · '+fn(p.by)+' · '+dthm(p.ts);$('#ov2').hidden=false;}
  else if(a==='rmdraft'){DRAFT.photos.splice(+d.i,1);thumbsDraft();}
  else if(a==='notifs'){notifsModal();}
  else if(a==='readall'){NOTIFS.forEach(n=>n.lida=true);render();notifsModal();}
  else if(a==='carout'){const c=car(d.car);c.st='entregue';c.saida=dm(now());c.saidaTs=now();if(!c.entrega)c.entrega=TK();render();toast(`${cn(c)} entregue às ${hm(now())}`);if(d.os)osDetail(d.os,true);}
  else if(a==='est'){const i=ESTOQUE.find(x=>x.id===+d.id);i.qtd=Math.max(0,i.qtd+(+d.d));render();}
  else if(a==='receber'){FIN.find(x=>x.id===+d.id).pago=true;render();toast('Pagamento registrado');}
  /* ordem da fila e meta */
  else if(a==='up'||a==='down'){swap(getOS(d.os),d.stage,a==='up'?-1:1);render();}
  else if(a==='meta'){const os=getOS(d.os),s=os.stages[d.stage];s.meta=s.meta===TK()?null:TK();if(s.meta)toEnd(os,d.stage);
    if($('#ov').hidden)render();else refreshOS(os.id);}
  else if(a==='montarmeta'){let n=0;OSL.forEach(os=>{const k=curStage(os);if(k&&os.stages[k].meta!==TK()){os.stages[k].meta=TK();n++}});render();toast(`${n} ${n===1?'carro colocado':'carros colocados'} na meta de hoje`);}
  else if(a==='nextsector'){const os=getOS(d.os),k=curStage(os);if(!k)return;finishForm(os.id,k);}
  else if(a==='rmstage'){const os=getOS(d.os);const pend=applicable(os).filter(x=>os.stages[x].st!=='feita');if(pend.length===1&&pend[0]===d.stage){toast('Esta é a última etapa: finalize com a foto da finalização.');return;}os.stages[d.stage].on=false;os.stages[d.stage].meta=null;const k=curStage(os);if(k)arrive(os,k);syncCar(os);refreshOS(os.id);toast(`${SETORES[d.stage].nome} tirada desta OS`);}
  else if(a==='assign'){ASG={k:d.stage,emp:d.emp||null,car:null};assignModal();}
  else if(a==='aspick'){ASG.car=d.car?+d.car:null;assignModal();}
  else if(a==='asdo'){const c=car(ASG.car),k=$('#as-k').value,e2=$('#as-e').value||null,meta=$('#as-meta').checked;
    if(e2&&!emp(e2).faz.includes(k)){toast(`${fn(e2)} não trabalha na ${SETORES[k].nome}. Escolha outro funcionário.`);return;}
    let os=osOf(c.id);
    if(!os||isDone(os)){os=mkOS(c.id,{},[]);OSL.push(os);}
    const s=os.stages[k];
    if(s.st==='feita'){s.st='fila';s.log.push(L('reaberta',now()));}
    s.on=true;s.emp=e2;s.meta=meta?TK():s.meta;toEnd(os,k);if(c.st==='entregue'){c.st='servico';c.entrega=null;}syncCar(os);
    closeModal();render();toast(`${cn(c)} na fila de ${e2?fn(e2):SETORES[k].nome} · ${posOf(os,k)}º · ${os.num}`);}
  /* dados do carro e entregas */
  else if(a==='editcar'){carForm(d.car,d.os);}
  else if(a==='entrega'){entregaForm(d.car,d.os);}
  else if(a==='unent'){const c=car(d.car);c.entrega=null;c.hora='';render();if(d.os)osDetail(d.os);else closeModal();toast('Tirado das entregas de hoje');}
  /* marketing */
  else if(a==='mktweek'){state.mktWeek=+d.d===0?monday(TK()):addDays(state.mktWeek||monday(TK()),+d.d);render();}
  else if(a==='newpost'){postForm(null,d.dia,d.ideia);}
  else if(a==='editpost'){postForm(d.id);}
  else if(a==='delpost'){if(t.dataset.ok){POSTS=POSTS.filter(x=>x.id!==+d.id);closeModal();render();toast('Conteúdo apagado');}else{t.dataset.ok='1';t.textContent='Toque de novo para apagar';}}
  else if(a==='delideia'){IDEIAS=IDEIAS.filter(x=>x.id!==+d.id);render();}
  /* agenda do Alex */
  else if(a==='day'){state.todoDay=+d.d===0?TK():addDays(state.todoDay||TK(),+d.d);render();}
  else if(a==='tododel'){TODO=TODO.filter(x=>x.id!==+d.id);render();}
  else if(a==='todohoje'){const x=TODO.find(y=>y.id===+d.id);x.dia=TK();render();}
  else if(a==='reset'){if(t.dataset.ok){try{localStorage.removeItem(SKEY)}catch(_){}seedAll();render();toast('Dados da agenda diária carregados de novo');}else{t.dataset.ok='1';t.textContent='Toque de novo para confirmar (apaga as alterações)';}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='q'){e.preventDefault();const b=$('#qres .qr');if(b)b.click();return;}
  if(e.key!=='Escape')return;if(!$('#ov2').hidden)$('#ov2').hidden=true;else if(!$('#ov').hidden)closeModal();else{const q=$('#qres');if(q)q.hidden=true;}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='q'){const r=$('#qres');const v=t.value.trim();if(!v){r.hidden=true;return;}r.innerHTML=qresHtml(v);r.hidden=false;}
  else if(t.id==='as-q'){$('#as-res').innerHTML=asList(t.value.trim());}
  else if(t.id==='c-placa'){$('#c-found').innerHTML=foundHtml(t.value);}
});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&e.target.value.trim()){$('#qres').hidden=false;}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.task){const os=getOS(t.dataset.os);const tk=os.stages[t.dataset.stage].tasks.find(x=>x.id===+t.dataset.task);tk.done=t.checked;refreshOS(os.id);}
  else if(t.dataset.assign){const os=getOS(t.dataset.assign),k=t.dataset.stage;os.stages[k].emp=t.value||null;toEnd(os,k);refreshOS(os.id);toast('Responsável atualizado. O carro entrou no fim da fila dele.');}
  else if(t.dataset.movesector){if(!t.value)return;const os=getOS(t.dataset.movesector),cur=curStage(os);
    if(cur&&STAGES.indexOf(t.value)>STAGES.indexOf(cur)){finishForm(os.id,cur,t.value);return;}
    moveTo(os,t.value,state.user);toast(`Carro e OS foram para a ${SETORES[t.value].nome}`);refreshOS(os.id);}
  else if(t.dataset.postcar){const c=t.value?car(t.value):null,os=c?osOf(c.id):null,f=os?os.photos:[];$('#m-fotos').innerHTML=c?`<div class="subh" style="margin-bottom:6px">Fotos deste carro no sistema (${f.length})</div>${f.length?figs(os,f):'<span class="note">Ainda sem fotos.</span>'}`:'';}
  else if(t.dataset.hora){const c=car(t.dataset.hora);c.hora=t.value;render();}
  else if(t.dataset.todo){const x=TODO.find(y=>y.id===+t.dataset.todo);x.done=t.checked;x.doneTs=t.checked?now():null;render();}
  else if(t.dataset.stagephoto){const os=getOS(t.dataset.stagephoto),k=t.dataset.stage,files=[...t.files];let n=0;
    for(const f of files){const src=await readImg(f);if(src){addPhoto(os,k,k==='in'?'Recebimento':SETORES[k].nome+' · andamento',src,state.user.id);n++}}
    t.value='';refreshOS(os.id);toast(n?`${n} ${n===1?'foto adicionada':'fotos adicionadas'}`:'Não foi possível ler a foto');}
  else if(t.dataset.draft){const files=[...t.files];for(const f of files){const src=await readImg(f);if(src)DRAFT.photos.push(src);}t.value='';thumbsDraft();}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,id=f.id;
  if(id==='f-login'){
    const u=USERS.find(x=>x.usuario===norm($('#l-user').value));
    if(!u||$('#l-pass').value!==senhaDe(u)){$('#l-err').textContent='Usuário ou senha incorretos. Confira e tente de novo.';return;}
    state.user=u;state.view=navFor(u)[0];render();
  }else if(id==='f-os'){
    const stages={};let first=null;
    STAGES.forEach(k=>{if(!$('#o-on-'+k).checked)return;const lines=$('#o-t-'+k).value.split('\n').map(s=>s.trim()).filter(Boolean);
      stages[k]=ST({on:true,emp:$('#o-e-'+k).value||null,tasks:lines.map(txt=>({id:nTask++,txt,done:false}))});if(!first)first=k;});
    if(!first){$('#o-err').textContent='Marque pelo menos um setor.';return;}
    let c;
    if(f.dataset.car)c=car(f.dataset.car);
    else{const pl=$('#c-placa').value.trim().toUpperCase(),ex=pl&&CARS.find(x=>plateN(x.placa)===plateN(pl));
      if(ex){const o=osOf(ex.id);if(o&&!isDone(o)){$('#o-err').textContent='Este carro já tem uma OS aberta. Toque em “Abrir a OS” acima.';return;}c=ex;}
      else{c={id:nextCar++,placa:pl,modelo:$('#c-modelo').value.trim(),cor:$('#c-cor').value.trim(),cliente:$('#c-cli').value.trim(),st:'servico',ent:dm(now()),prev:'',entrega:null,hora:'',entOrd:0};CARS.push(c);}}
    c.st='servico';c.entrega=c.entrega===TK()?c.entrega:null;
    const t=now();
    const os=mkOS(c.id,stages,[]);DRAFT.photos.forEach(src=>addPhoto(os,'in','Recebimento',src,state.user.id,t));
    OSL.push(os);if($('#o-meta').checked)os.stages[first].meta=TK();toEnd(os,first);
    closeModal();render();toast(`${os.num} criada para ${cn(c)} · está na ${SETORES[first].nome}`);
  }else if(id==='f-car'){
    const c=car(f.dataset.car),pl=$('#e-placa').value.trim().toUpperCase();
    if(pl&&CARS.some(x=>x!==c&&plateN(x.placa)===plateN(pl))){$('#e-err').textContent='Já existe outro carro com esta placa.';return;}
    c.placa=pl;c.modelo=$('#e-modelo').value.trim();c.cor=$('#e-cor').value.trim();c.cliente=$('#e-cli').value.trim();
    render();toast('Dados do carro salvos');if(f.dataset.os)osDetail(f.dataset.os);else closeModal();
  }else if(id==='f-ent'){
    const c=car(f.dataset.car||$('#e-car').value);if(!c){closeModal();return;}
    if(c.entrega!==TK())c.entOrd=Math.max(0,...entregasHoje().map(x=>x.entOrd))+1;
    c.entrega=TK();c.hora=$('#e-hora').value;render();toast(`${cn(c)} na lista de entregas de hoje`);if(f.dataset.os)osDetail(f.dataset.os);else closeModal();
  }else if(id==='f-post'){
    const v={dia:$('#m-dia').value,hora:$('#m-hora').value,formato:$('#m-fmt').value,titulo:$('#m-tit').value.trim(),texto:$('#m-txt').value.trim(),status:$('#m-st').value,car:$('#m-car').value?+$('#m-car').value:''};
    if(!v.dia||!v.titulo)return;
    if(f.dataset.id)Object.assign(POSTS.find(x=>x.id===+f.dataset.id),v);else POSTS.push(Object.assign({id:nPost++},v));
    if(f.dataset.ideia)IDEIAS=IDEIAS.filter(x=>x.id!==+f.dataset.ideia);
    state.mktWeek=monday(v.dia);closeModal();render();toast(f.dataset.id?'Conteúdo atualizado':'Conteúdo agendado');
  }else if(id==='f-ideia'){
    const txt=$('#i-txt').value.trim();if(!txt)return;IDEIAS.push({id:nIdeia++,txt,formato:$('#i-fmt').value,ts:now()});render();const i=$('#i-txt');if(i)i.focus();
  }else if(id==='f-pwd'){
    const u=state.user,o=$('#w-old').value,n=$('#w-new').value,r2=$('#w-rep').value;
    if(o!==senhaDe(u)){$('#w-err').textContent='A senha atual não confere.';return;}
    if(n.length<4){$('#w-err').textContent='A nova senha precisa ter pelo menos 4 caracteres.';return;}
    if(n!==r2){$('#w-err').textContent='As duas senhas novas estão diferentes.';return;}
    SENHAS[u.id]=n;closeModal();render();toast('Senha alterada');
  }else if(id==='f-pwdr'){
    const n=$('#r-new').value.trim();if(n.length<4){$('#r-err').textContent='A senha precisa ter pelo menos 4 caracteres.';return;}
    SENHAS[f.dataset.u]=n;closeModal();render();toast(`Senha de ${fn(f.dataset.u)} redefinida`);
  }else if(id==='f-todo'){
    const txt=$('#t-txt').value.trim();if(!txt)return;
    TODO.push({id:nTodo++,dia:state.todoDay||TK(),hora:$('#t-hora').value,txt,done:false});render();const i=$('#t-txt');if(i)i.focus();
  }else if(id==='f-item'){
    ESTOQUE.push({id:nItem++,cat:$('#i-cat').value,nome:$('#i-nome').value.trim(),un:$('#i-un').value.trim(),qtd:Math.max(0,+$('#i-qtd').value||0),min:Math.max(0,+$('#i-min').value||0)});
    closeModal();render();toast('Item adicionado ao estoque');
  }else if(id==='f-pause'){
    const os=getOS(f.dataset.os);pauseStage(os,f.dataset.stage,state.user,$('#p-why').value);toast('Serviço pausado. O Alex foi avisado.');refreshOS(os.id);
  }else if(id==='f-finish'){
    const os=getOS(f.dataset.os),k=f.dataset.stage,s=os.stages[k];
    if(s.tasks.some(x=>!x.done)){$('#f-err').textContent='Marque todos os itens como feitos antes de finalizar.';return;}
    if(!DRAFT.photos.length){$('#f-err').textContent='Tire ao menos uma foto do serviço finalizado.';return;}
    finishStage(os,k,state.user,$('#f-nota').value.trim(),DRAFT.photos);DRAFT.photos=[];if(f.dataset.goto&&curStage(os)&&curStage(os)!==f.dataset.goto)moveTo(os,f.dataset.goto,state.user);const nx=curStage(os);
    toast(nx?`Finalizado. Carro e OS foram para a ${SETORES[nx].nome}. O Alex foi avisado.`:'Finalizado. Carro pronto para retirada. O Alex foi avisado.');refreshOS(os.id);
  }else if(id==='f-flag'){
    const os=getOS(f.dataset.os),k=f.dataset.stage,txt=$('#g-txt').value.trim();if(!txt)return;
    os.problemas.push({id:nProb++,stage:k,by:state.user.id,ts:now(),txt,aberto:true});
    notify('problem',`${fn(state.user.id)} (${state.user.rotulo}) sinalizou um problema na ${SETORES[k].nome} do ${cn(car(os.car))}: ${txt}`,os.id);
    toast('Aviso enviado ao Alex');refreshOS(os.id);
  }
});
(async()=>{idb=await idbOpen();
  if(!load())seedAll();
  else{const m=await idbAll();OSL.forEach(os=>os.photos.forEach(p=>{if(p.src==='@')p.src=m[p.id]||NOPHOTO}))}
  render();})();
})();
</script>
